{% extends 'base.html' %}
{% block content %}
<h2>Add New Post</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
  <button type="submit" style="padding:8px 15px; background:#3897f0; color:white; border:none; cursor:pointer;">
        Upload Post
    </button>
</form>

{% endblock %}
