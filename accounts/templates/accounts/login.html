{% load static %}

<div style="width:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; margin-top:40px;">

    <!-- Centered Logo -->
    <img src="{% static 'accounts/images/instagram-sign-logo.png' %}" 
         alt="Instagram Logo" 
         style="width:150px; height:auto; margin-bottom:20px;">

    <!-- Login Form Box -->
    <div style="width:350px; border:1px solid #ddd; padding:25px; background:white; text-align:center;">
        <h2 style="margin-bottom:20px;">Login</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
                style="width:100%; padding:10px; background:#0095F6; color:white; border:none; border-radius:5px; margin-top:10px;">
                Login
            </button>
        </form>

        <p style="margin-top:15px;">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>
    </div>

</div>
