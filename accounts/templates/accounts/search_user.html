<h2>Search Users</h2>

<form method="GET" action="{% url 'search_user' %}">
    {{ form.query }}
    <button type="submit">Search</button>
</form>

<hr>
{% load custom_filters %}

{% for user in results %}
    <p>
       <!-- Username as clickable link -->
        <a href="{% url 'view_profile' user.username %}"><b>{{ user.username }}</b></a>
        

        {% if user in request.user.profile.following.all %}
            <a href="{% url 'follow_toggle' user.id %}">Unfollow</a>
        {% else %}
            <a href="{% url 'follow_toggle' user.id %}">Follow</a>
        {% endif %}
        
    </p>
{% empty %}
    <p>No users found</p>
{% endfor %}
